<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Zoriah Cocio — Full-Stack Software Engineer and Open-Source Hardware Designer</title>
  <desc id="desc">A dark technical banner joining software interface lines with a four-key printed circuit board.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#020617"/>
      <stop offset="0.48" stop-color="#0B1120"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accent" x1="80" y1="190" x2="790" y2="190" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38BDF8"/>
      <stop offset="0.56" stop-color="#22C55E"/>
      <stop offset="1" stop-color="#A3E635"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1032 178) rotate(180) scale(380 270)">
      <stop stop-color="#EF4444" stop-opacity="0.18"/>
      <stop offset="0.48" stop-color="#38BDF8" stop-opacity="0.13"/>
      <stop offset="1" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" stroke="#94A3B8" stroke-opacity="0.07"/>
    </pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1200" height="360" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="28" fill="url(#grid)"/>
  <rect width="1200" height="360" rx="28" fill="url(#glow)"/>

  <path d="M45 88H304L346 130H574" stroke="#38BDF8" stroke-opacity="0.25" stroke-width="2"/>
  <path d="M47 285H244L281 248H565" stroke="#22C55E" stroke-opacity="0.2" stroke-width="2"/>
  <circle cx="304" cy="88" r="4" fill="#38BDF8"/>
  <circle cx="244" cy="285" r="4" fill="#22C55E"/>

  <g opacity="0.95">
    <rect x="78" y="51" width="202" height="32" rx="16" fill="#0F172A" stroke="#334155"/>
    <circle cx="101" cy="67" r="5" fill="#22C55E"/>
    <text x="117" y="72" fill="#CBD5E1" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" font-weight="700" letter-spacing="1.1">BUILDING END TO END</text>
  </g>

  <text x="78" y="148" fill="#F8FAFC" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="58" font-weight="800">Zoriah Cocio</text>
  <text x="80" y="192" fill="url(#accent)" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="23" font-weight="700">Full-Stack Engineer × Open-Source Hardware Designer</text>
  <text x="80" y="232" fill="#CBD5E1" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18" font-weight="500">Web systems · Embedded C++ · PCB design · Prototyping</text>

  <g transform="translate(80 270)">
    <rect width="168" height="34" rx="17" fill="#111827" stroke="#263244"/>
    <text x="18" y="22" fill="#E2E8F0" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" font-weight="700">Product Systems</text>
    <rect x="184" width="184" height="34" rx="17" fill="#111827" stroke="#263244"/>
    <text x="202" y="22" fill="#E2E8F0" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" font-weight="700">Embedded Firmware</text>
    <rect x="384" width="138" height="34" rx="17" fill="#111827" stroke="#263244"/>
    <text x="402" y="22" fill="#E2E8F0" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" font-weight="700">PCB + CAD</text>
  </g>

  <g transform="translate(876 45)" filter="url(#shadow)">
    <rect width="244" height="270" rx="24" fill="#7F1D1D" stroke="#F87171" stroke-width="2"/>
    <rect x="13" y="13" width="218" height="244" rx="16" fill="#991B1B" stroke="#EF4444" stroke-opacity="0.72"/>
    <text x="122" y="35" text-anchor="middle" fill="#FDE68A" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="800" letter-spacing="1.4">RP2040 MACROPAD</text>

    <g fill="#111827" stroke="#64748B" stroke-width="2">
      <rect x="40" y="53" width="68" height="68" rx="9"/>
      <rect x="136" y="53" width="68" height="68" rx="9"/>
      <rect x="40" y="137" width="68" height="68" rx="9"/>
      <rect x="136" y="137" width="68" height="68" rx="9"/>
    </g>
    <g fill="#38BDF8" fill-opacity="0.82" stroke="#BAE6FD">
      <circle cx="74" cy="87" r="16"/>
      <circle cx="170" cy="87" r="16"/>
      <circle cx="74" cy="171" r="16"/>
      <circle cx="170" cy="171" r="16"/>
    </g>

    <rect x="84" y="218" width="76" height="28" rx="5" fill="#0F172A" stroke="#94A3B8"/>
    <g fill="#FDE68A">
      <circle cx="93" cy="226" r="2"/><circle cx="93" cy="233" r="2"/><circle cx="93" cy="240" r="2"/>
      <circle cx="151" cy="226" r="2"/><circle cx="151" cy="233" r="2"/><circle cx="151" cy="240" r="2"/>
    </g>

    <g fill="#FDE68A" stroke="#FFF7CC" stroke-width="1">
      <circle cx="27" cy="27" r="6"/><circle cx="217" cy="27" r="6"/>
      <circle cx="27" cy="243" r="6"/><circle cx="217" cy="243" r="6"/>
    </g>
    <path d="M27 43V88H40M217 43V87H204M27 227V171H40M217 227V171H204" stroke="#FDE68A" stroke-opacity="0.75" stroke-width="2"/>
  </g>

  <path d="M801 96H850L876 122" stroke="#38BDF8" stroke-opacity="0.55" stroke-width="2"/>
  <path d="M772 262H838L876 225" stroke="#22C55E" stroke-opacity="0.45" stroke-width="2"/>
  <circle cx="801" cy="96" r="4" fill="#38BDF8"/>
  <circle cx="772" cy="262" r="4" fill="#22C55E"/>
</svg>
